name: quran_easy_native
description: "Quran Easy Malayalam - Native Flutter App"
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  flutter_tts: ^4.2.2
  supabase_flutter: ^2.8.4
  google_generative_ai: ^0.4.6
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  dio: ^5.8.0+1
  http: ^1.3.0
  flutter_svg: ^2.0.17
  vector_graphics: ^1.1.13
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/qvp/
    - assets/images/
    - assets/fonts/
    - assets/ornaments/page-frames/
    - assets/ornaments/surah-headers/
    - assets/ornaments/ayah-markers/

  fonts:
    - family: QCF4_QBSML
      fonts:
        - asset: assets/fonts/QCF4_QBSML.ttf
    - family: QCF4_Hafs_01
      fonts:
        - asset: assets/fonts/QCF4_Hafs_01_W.ttf
